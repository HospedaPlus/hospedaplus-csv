[project]
name = "buenavista-csv"
version = "1.0.0"
description = "HospedaPlus Revenue Management — File-Based Data Sources (F1 Historical CSV & F4 Traditional Agency Files)"
readme = "README.md"
authors = [
    { name = "Oscar Corzo", email = "corzooscar143@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
neon = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
audit-f1 = "buenavista_csv.f1_audit:main"
generate-f4 = "buenavista_csv.f4_generator:main"
validate-csv-sources = "buenavista_csv.validator:main"
load-f4 = "buenavista_csv.f4_loader:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
